name: vyos

topology:
  defaults:
    kind: vyosnetworks_vyos
    image: vyos:1.0

  nodes:
    home: 
      startup-config: configs/vyos_home.cfg
    pe1: 
      startup-config: configs/vyos_pe1.cfg
    p: 
      startup-config: configs/vyos_p.cfg
    pe2: 
      startup-config: configs/vyos_pe2.cfg
    pc:
      kind: linux
      image: vnc-desktop:bookworm
      image-pull-policy: Never
      ports:
        - 5900:5900/tcp
      env:
        VNC_PASSWORD: "cisco123"
        VNC_GEOMETRY: "1440x900"
        VNC_DEPTH: "24"
      exec:
        - ip link set eth0 down
        - ip link set eth1 up
        - dhclient eth1
    www:
      kind: linux
      image: nginx:1.0
      exec:
        - ip link set eth1 up
        - ip addr add 192.168.2.100/24 dev eth1
        - ip route add 192.168.1.0/24 via 192.168.2.1
        - ip route add 192.168.100.0/24 via 192.168.2.1

  links:
    - endpoints: ["pc:eth1", "home:eth1"]
    - endpoints: ["home:eth2", "pe1:eth2"]
    - endpoints: ["pe1:eth1", "p:eth1"]
    - endpoints: ["p:eth2", "pe2:eth1"]
    - endpoints: ["pe2:eth2", "www:eth1"]
