name: mpls

topology:
  defaults:
    kind: frr
    image: quay.io/frrouting/frr:containerlab-10.7.1
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.rp_filter: "0"
      net.ipv4.conf.default.rp_filter: "0"
      net.mpls.platform_labels: "1048575"

  nodes:
    pe1:
      startup-config: configs/frr_pe1.cfg
      daemons:
        - ospfd
        - ldpd
        - bgpd
      exec:
        - ip link add CUST type vrf table 100
        - ip link set CUST up
        - ip link set eth2 master CUST
        - ip addr add 192.168.1.1/242 dev eth2
        - ip link set eth2 up
        - sysctl -w net.ipv4.conf.eth1.rp_filter=0
        - sysctl -w net.mpls.conf.eth1.input=1
        - vtysh -b

    p:
      startup-config: configs/frr_p.cfg
      daemons:
        - ospfd
        - ldpd
      exec:
        - sysctl -w net.ipv4.conf.eth1.rp_filter=0
        - sysctl -w net.ipv4.conf.eth2.rp_filter=0
        - sysctl -w net.mpls.conf.eth1.input=1
        - sysctl -w net.mpls.conf.eth2.input=1

    pe2:
      startup-config: configs/frr_pe2.cfg
      daemons:
        - ospfd
        - ldpd
        - bgpd
      exec:
        - ip link add CUST type vrf table 100
        - ip link set CUST up
        - ip link set eth2 master CUST
        - ip addr add 192.168.2.1/242 dev eth2
        - ip link set eth2 up
        - sysctl -w net.ipv4.conf.eth1.rp_filter=0
        - sysctl -w net.mpls.conf.eth1.input=1
        - vtysh -b

    pc:
      kind: linux
      image: vnc-desktop:bookworm
      image-pull-policy: Never
      ports:
        - 5900:5900/tcp
      env:
        VNC_PASSWORD: "cisco123"
        VNC_GEOMETRY: "1440x900"
        VNC_DEPTH: "24"
      exec:
        - ip link set eth1 up
        - ip addr add 192.168.1.100/24 dev eth1
        - ip route add 192.168.2.0/24 via 192.168.1.1
    www:
      kind: linux
      image: nginx:1.0
      exec:
        - ip link set eth1 up
        - ip addr add 192.168.2.100/24 dev eth1
        - ip route add 192.168.1.0/24 via 192.168.2.1

  links:
    - endpoints: ["pc:eth1", "pe1:eth2"]
    - endpoints: ["pe1:eth1", "p:eth1"]
    - endpoints: ["p:eth2", "pe2:eth1"]
    - endpoints: ["pe2:eth2", "www:eth1"]
