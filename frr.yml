name: mpls

topology:
  defaults:
    kind: frr
    image: quay.io/frrouting/frr:containerlab-10.7.1
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.rp_filter: "0"
      net.ipv4.conf.default.rp_filter: "0"
      net.mpls.platform_labels: "1048575"

  nodes:
    pe1:
      startup-config: configs/frr_pe1.cfg
      daemons:
        - ospfd
        - ldpd
        - bgpd
      exec:
        - ip link add CUST type vrf table 100
        - ip link set CUST up
        - ip link add custlo type dummy
        - ip link set custlo master CUST
        - ip addr add 192.168.1.1/32 dev custlo
        - ip link set custlo up
        - sysctl -w net.ipv4.conf.eth1.rp_filter=0
        - sysctl -w net.mpls.conf.eth1.input=1
        - vtysh -b

    p:
      startup-config: configs/frr_p.cfg
      daemons:
        - ospfd
        - ldpd
      exec:
        - sysctl -w net.ipv4.conf.eth1.rp_filter=0
        - sysctl -w net.ipv4.conf.eth2.rp_filter=0
        - sysctl -w net.mpls.conf.eth1.input=1
        - sysctl -w net.mpls.conf.eth2.input=1

    pe2:
      startup-config: configs/frr_pe2.cfg
      daemons:
        - ospfd
        - ldpd
        - bgpd
      exec:
        - ip link add CUST type vrf table 100
        - ip link set CUST up
        - ip link add custlo type dummy
        - ip link set custlo master CUST
        - ip addr add 192.168.2.1/32 dev custlo
        - ip link set custlo up
        - sysctl -w net.ipv4.conf.eth1.rp_filter=0
        - sysctl -w net.mpls.conf.eth1.input=1
        - vtysh -b

  links:
    - endpoints: ["pe1:eth1", "p:eth1"]
    - endpoints: ["p:eth2", "pe2:eth1"]
