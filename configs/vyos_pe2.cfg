interfaces {
    ethernet eth0 {
        address "172.20.20.4/24"
        address "3fff:172:20:20::4/64"
        description "Management Interface"
    }
    ethernet eth1 {
        address "10.0.23.2/30"
    }
    ethernet eth2 {
        address "192.168.2.1/24"
        vrf "Internet"
    }
    ethernet eth3 {
        address "100.0.0.254/24"
        vrf "Internet"
    }
    loopback lo {
        address "3.3.3.3/32"
    }
}
pki {
    ca clab {
        certificate ""
    }
    certificate self {
        certificate ""
        private {
            key ""
        }
    }
}
protocols {
    bgp {
        neighbor 1.1.1.1 {
            address-family {
                ipv4-vpn {
                }
            }
            remote-as "65000"
            update-source "3.3.3.3"
        }
        parameters {
            router-id "3.3.3.3"
        }
        system-as "65000"
    }
    mpls {
        interface "eth1"
        ldp {
            discovery {
                transport-ipv4-address "3.3.3.3"
            }
            interface eth1 {
            }
            router-id "3.3.3.3"
        }
    }
    ospf {
        area 0 {
            network "3.3.3.3/32"
            network "10.0.23.0/30"
        }
        interface eth1 {
            network "point-to-point"
        }
        interface lo {
            passive {
            }
        }
        parameters {
            router-id "3.3.3.3"
        }
    }
}
service {
    https {
        api {
            keys {
                id admin {
                    key "admin"
                }
            }
            rest {
            }
        }
        certificates {
            ca-certificate "clab"
            certificate "self"
        }
        listen-address "0.0.0.0"
    }
    ntp {
        allow-client {
            address "127.0.0.0/8"
            address "169.254.0.0/16"
            address "10.0.0.0/8"
            address "172.16.0.0/12"
            address "192.168.0.0/16"
            address "::1/128"
            address "fe80::/10"
            address "fc00::/7"
        }
        server time1.vyos.net {
        }
        server time2.vyos.net {
        }
        server time3.vyos.net {
        }
    }
    ssh {
        listen-address "0.0.0.0"
    }
}
system {
    config-management {
        commit-revisions "100"
    }
    host-name "pe2"
    login {
        user admin {
            authentication {
                encrypted-password "$6$rounds=656000$2imSMKkpeVz318M5$HfKd19S7LBMhsWgpbELbPen8p0x.DOmpg3sdYFmhsxTplvWIB2Dp8eJps/wm.m/baBX7gR2i9Uu3Cff3r8SSW/"
                public-keys clab {
                    key ""
                    type "ssh-rsa"
                }
            }
        }
    }
    syslog {
        local {
            facility all {
                level "info"
            }
            facility local7 {
                level "debug"
            }
        }
    }
}
vrf {
    name Internet {
        protocols {
            bgp {
                address-family {
                    ipv4-unicast {
                        export {
                            vpn
                        }
                        import {
                            vpn
                        }
                        label {
                            vpn {
                                export "auto"
                            }
                        }
                        rd {
                            vpn {
                                export "65000:2"
                            }
                        }
                        redistribute {
                            connected {
                            }
                        }
                        route-target {
                            vpn {
                                both "65000:100"
                            }
                        }
                    }
                }
                parameters {
                    router-id "3.3.3.3"
                }
                system-as "65000"
            }
        }
        table "100"
    }
}


