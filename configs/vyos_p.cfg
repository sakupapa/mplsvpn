interfaces {
    ethernet eth0 {
        address "172.20.20.2/24"
        address "3fff:172:20:20::2/64"
        description "Management Interface"
    }
    ethernet eth1 {
        address "10.0.12.2/30"
    }
    ethernet eth2 {
        address "10.0.23.1/30"
    }
    loopback lo {
        address "2.2.2.2/32"
    }
}
pki {
    ca clab {
        certificate ""
    }
    certificate self {
        certificate ""
        private {
            key ""
        }
    }
}
protocols {
    mpls {
        interface "eth1"
        interface "eth2"
        ldp {
            discovery {
                transport-ipv4-address "2.2.2.2"
            }
            interface eth1 {
            }
            interface eth2 {
            }
            router-id "2.2.2.2"
        }
    }
    ospf {
        area 0 {
            network "2.2.2.2/32"
            network "10.0.12.0/30"
            network "10.0.23.0/30"
        }
        interface eth1 {
            network "point-to-point"
        }
        interface eth2 {
            network "point-to-point"
        }
        interface lo {
            passive {
            }
        }
        parameters {
            router-id "2.2.2.2"
        }
    }
}
service {
    https {
        api {
            keys {
                id admin {
                    key "admin"
                }
            }
            rest {
            }
        }
        certificates {
            ca-certificate "clab"
            certificate "self"
        }
        listen-address "0.0.0.0"
    }
    ntp {
        allow-client {
            address "127.0.0.0/8"
            address "169.254.0.0/16"
            address "10.0.0.0/8"
            address "172.16.0.0/12"
            address "192.168.0.0/16"
            address "::1/128"
            address "fe80::/10"
            address "fc00::/7"
        }
        server time1.vyos.net {
        }
        server time2.vyos.net {
        }
        server time3.vyos.net {
        }
    }
    ssh {
        listen-address "0.0.0.0"
    }
}
system {
    config-management {
        commit-revisions "100"
    }
    login {
        user admin {
            authentication {
                encrypted-password "$6$rounds=656000$imINwrgLiK3XpDwP$VyC824I/jViB4CcyFl/Y45VraBjhQuRgtMpQU7HmQhkeekbmKrBvbl7QVMo8uPpTeC7yLzTd9elOS0i/0veBX."
                public-keys clab {
                    key ""
                    type "ssh-rsa"
                }
            }
        }
    }
    syslog {
        local {
            facility all {
                level "info"
            }
            facility local7 {
                level "debug"
            }
        }
    }
}


