interfaces {
    ethernet eth0 {
        address "172.20.20.5/24"
        address "3fff:172:20:20::5/64"
        description "Management Interface"
        offload {
            gso
            sg
            tso
        }
    }
    ethernet eth1 {
        address "192.168.100.254/24"
        description "PRIVATE"
    }
    ethernet eth2 {
        address "192.168.1.100/24"
        description "PUBLIC"
    }
    loopback lo {
    }
}
nat {
    source {
        rule 100 {
            description "PRIVATE-to-PUBLIC-PAT"
            outbound-interface {
                name "eth2"
            }
            source {
                address "192.168.100.0/24"
            }
            translation {
                address "masquerade"
            }
        }
    }
}
pki {
    ca clab {
        certificate ""
    }
    certificate self {
        certificate ""
        private {
            key ""
        }
    }
}
protocols {
    static {
        route 192.168.2.0/24 {
            next-hop 192.168.1.1 {
                interface "eth2"
            }
        }
    }
}
service {
    dhcp-server {
        shared-network-name CUST {
            subnet 192.168.100.0/24 {
                range 0 {
                    start "192.168.100.100"
                    stop "192.168.100.200"
                }
                subnet-id "1"
            }
        }
    }
    https {
        api {
            keys {
                id admin {
                    key "admin"
                }
            }
            rest {
            }
        }
        certificates {
            ca-certificate "clab"
            certificate "self"
        }
        listen-address "0.0.0.0"
    }
    ntp {
        allow-client {
            address "127.0.0.0/8"
            address "169.254.0.0/16"
            address "10.0.0.0/8"
            address "172.16.0.0/12"
            address "192.168.0.0/16"
            address "::1/128"
            address "fe80::/10"
            address "fc00::/7"
        }
        server time1.vyos.net {
        }
        server time2.vyos.net {
        }
        server time3.vyos.net {
        }
    }
    ssh {
        listen-address "0.0.0.0"
    }
}
system {
    config-management {
        commit-revisions "100"
    }
    console {
        device ttyS0 {
            speed "115200"
        }
    }
    host-name "home"
    login {
        user admin {
            authentication {
                encrypted-password "$6$rounds=656000$zNQFabezUGSw0HNt$5Xl8LzZX8hj8BXqf8k24nLXBwnmZWApQnBGOGgnJPmL93RlPyEnYOirF/Lz/LOHYgnwKvxnBLxGSASLCunZ6N1"
                public-keys clab {
                    key ""
                    type "ssh-rsa"
                }
            }
        }
    }
    syslog {
        local {
            facility all {
                level "info"
            }
            facility local7 {
                level "debug"
            }
        }
    }
}


