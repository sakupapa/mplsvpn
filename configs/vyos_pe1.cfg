interfaces {
    ethernet eth2 {
        address "192.168.1.1/24"
        vrf "CUST"
    }
    ethernet eth0 {
        address "172.20.20.3/24"
        address "3fff:172:20:20::3/64"
        description "Management Interface"
    }
    ethernet eth1 {
        address "10.0.12.1/30"
    }
    loopback lo {
        address "1.1.1.1/32"
    }
}
pki {
    ca clab {
        certificate ""
    }
    certificate self {
        certificate ""
        private {
            key ""
        }
    }
}
protocols {
    bgp {
        neighbor 3.3.3.3 {
            address-family {
                ipv4-vpn {
                }
            }
            remote-as "65000"
            update-source "1.1.1.1"
        }
        parameters {
            router-id "1.1.1.1"
        }
        system-as "65000"
    }
    mpls {
        interface "eth1"
        ldp {
            discovery {
                transport-ipv4-address "1.1.1.1"
            }
            interface eth1 {
            }
            router-id "1.1.1.1"
        }
    }
    ospf {
        area 0 {
            network "1.1.1.1/32"
            network "10.0.12.0/30"
        }
        interface eth1 {
            network "point-to-point"
        }
        interface lo {
            passive {
            }
        }
        parameters {
            router-id "1.1.1.1"
        }
    }
}
service {
    https {
        api {
            keys {
                id admin {
                    key "admin"
                }
            }
            rest {
            }
        }
        certificates {
            ca-certificate "clab"
            certificate "self"
        }
        listen-address "0.0.0.0"
    }
    ntp {
        allow-client {
            address "127.0.0.0/8"
            address "169.254.0.0/16"
            address "10.0.0.0/8"
            address "172.16.0.0/12"
            address "192.168.0.0/16"
            address "::1/128"
            address "fe80::/10"
            address "fc00::/7"
        }
        server time1.vyos.net {
        }
        server time2.vyos.net {
        }
        server time3.vyos.net {
        }
    }
    ssh {
        listen-address "0.0.0.0"
    }
}
system {
    config-management {
        commit-revisions "100"
    }
    host-name "pe1"
    login {
        user admin {
            authentication {
                encrypted-password "$6$rounds=656000$IwkS6hpdfSzzm58j$2.jP9zF3reuso74DxZ2b4jy8R/OS8kMI9N17KcGbK0p33DiuBo2CU0L5i/T6XJ7Y0xWLwnMba.oAQjLrb52zS."
                public-keys clab {
                    key ""
                    type "ssh-rsa"
                }
            }
        }
    }
    syslog {
        local {
            facility all {
                level "info"
            }
            facility local7 {
                level "debug"
            }
        }
    }
}
vrf {
    name CUST {
        protocols {
            bgp {
                address-family {
                    ipv4-unicast {
                        export {
                            vpn
                        }
                        import {
                            vpn
                        }
                        label {
                            vpn {
                                export "auto"
                            }
                        }
                        rd {
                            vpn {
                                export "65000:1"
                            }
                        }
                        redistribute {
                            connected {
                            }
                        }
                        route-target {
                            vpn {
                                both "65000:100"
                            }
                        }
                    }
                }
                parameters {
                    router-id "1.1.1.1"
                }
                system-as "65000"
            }
        }
        table "100"
    }
}


